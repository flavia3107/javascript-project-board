<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Project Board</title>
  <link rel="stylesheet" href="./assets/styles/app.css" />
  <script src="./assets/scripts/app.js" defer type="module"></script>
</head>

<body>
  <header id="main-header">
    <a href="https://all-projects-portfolio.web.app/" target="_blank">
      <img src="./assets/logo.svg" />
    </a>
  </header>
  <div class="project-container">
    <section id="active-projects">
      <header>
        <h2>Active Projects</h2>
      </header>
      <ul>
        <li id="p1" data-extra-info="Got lifetime access, but would be nice to finish it soon!" class="card"
          draggable="true">
          <h2>
            <span>Finish the Course </span>
            <button>Finish</button>
          </h2>
          <p>Finish the course within the next two weeks.</p>
        </li>
        <li id="p2" data-extra-info="Not really a business topic but still important." class="card" draggable="true">
          <h2>Buy Groceries <button>Finish</button> </h2>
          <p>Don't forget to pick up groceries today.</p>
        </li>
      </ul>
    </section>
    <section id="finished-projects">
      <header>
        <h2>Finished Projects</h2>
      </header>
      <ul>
        <li id="p3" data-extra-info="Super important conference! Fictional but still!" class="card" draggable="true">
          <h2>Book Hotel <button>Activate</button> </h2>
          <p>
            Academind conference takes place in December, don't forget to book a
            hotel.
          </p>
        </li>
      </ul>
    </section>
  </div>

</body>

</html>
